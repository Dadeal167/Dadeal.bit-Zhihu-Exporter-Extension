<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>打印 - 知乎文章</title>
  <script>
  // 简化配置: tex-svg-full.js 已内置全部扩展, 不指定 packages, 避免加载扩展出错
  MathJax = {
    tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] },
    // fontCache:'none' 让每个公式 SVG 自包含, 便于 html2canvas 兜底截图
    svg: { fontCache: 'none' }
  };
  </script>
  <script>
  // 渲染完成标记: 无论成功失败, 15 秒内必定设置 data-mathjax-ready='1',
  // 避免后台/截图流程无限等待
  (function () {
    var done = false;
    function markReady() {
      if (done) return;
      done = true;
      document.body.setAttribute('data-mathjax-ready', '1');
    }
    window.addEventListener('load', function () {
      if (window.MathJax && window.MathJax.startup && window.MathJax.typesetPromise) {
        MathJax.startup.promise
          .then(function () { return MathJax.typesetPromise(); })
          .then(markReady)
          .catch(markReady);
      } else {
        // MathJax 加载失败也打标记, 避免无限等待
        markReady();
      }
    });
    setTimeout(markReady, 15000); // 兜底
  })();
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
           line-height: 1.8; max-width: 900px; margin: 0 auto; padding: 2em; color: #333; }
    img { max-width: 100%; height: auto; border-radius: 8px; margin: 16px 0; }
    h1, h2, h3 { color: #111; border-bottom: 1px solid #eaecef; padding-bottom: .3em; }
    pre { background: #f6f8fa; padding: 16px; border-radius: 8px; overflow-x: auto; }
    code { background: rgba(27,31,35,.05); padding: .2em .4em; border-radius: 3px; }
    blockquote { border-left: 4px solid #dfe2e5; padding-left: 1em; color: #6a737d; margin-left: 0; }
    @media print {
      body { padding: 0; }
    }
  </style>
</head>
<body>
  <div id="content">加载中...</div>
  <script src="lib/html2canvas.min.js"></script>
  <script src="lib/jspdf.umd.min.js"></script>
  <script src="print.js"></script>
</body>
</html>
